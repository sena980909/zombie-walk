<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zombie Walk</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #e6e8ec; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; top: 12px; padding: 10px 14px; border-radius: 10px;
      background: rgba(10, 13, 20, 0.75); border: 1px solid rgba(255,255,255,0.08); font-size: 13px; line-height: 1.7;
    }
    #hud b { color: #9ccc65; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; color: #9aa3b2;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <b>ZOMBIE</b> · 상태: <span id="state">대기</span><br />
    땅 클릭: 그 위치로 이동 · <kbd>WASD</kbd>/방향키: 직접 조종<br />
    드래그: 카메라 회전 · 휠: 줌
  </div>
  <div id="loading">좀비 모델 불러오는 중…</div>
  <script type="module" src="main.js"></script>
</body>
</html>
